name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "DoDaily-v${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APK=DoDaily-v${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: DoDaily-apk
          path: ${{ env.APK }}

      # Every push to main publishes/updates the release for the current versionName.
      # Bump versionName in app/build.gradle.kts to cut a new release.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DoDaily v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.APK }}
          generate_release_notes: true
          make_latest: true
